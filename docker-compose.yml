services:
  postgres:
    image: postgres:16-alpine
    container_name: menq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: menq
      POSTGRES_PASSWORD: menq
      POSTGRES_DB: menq
    ports:
      # Host 5433 (5432 is often taken by a local Postgres install) → container 5432.
      - "5433:5432"
    volumes:
      - menq-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menq -d menq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  menq-pgdata:
